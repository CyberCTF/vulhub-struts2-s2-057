# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Struts2 S2-057 (CVE-2018-11776) (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-057, vendored in build/struts2/app/, on the published image
# vulhub/struts2:2.3.34-showcase with Vulhub's mounted action chaining file copied in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-057

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.43.0/24, internet: false }

machines:
  struts2:
    networks: { lab: 10 }
    services: [{ port: 8080, name: web, http: true, publish: 8080 }]
    resources: { cpus: 1, memory_mb: 1024 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/struts2
      init: [ctf/flag.sh]

checks:
  - name: the showcase answers
    http: http://struts2:8080/showcase/
    wait: 180
  - name: the action chaining action (no namespace) is served
    script: checks/actionchain.sh
    wait: 60

message: |
  The Struts 2.3.34 showcase answers at http://localhost:{{ machines.struts2.services.0.publish }}/showcase/.
  The action chaining configuration redirects without a namespace: try one in the URL.
